name: roadmap dates

on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: read

jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GITHUB_TOKEN cannot reach a project owned by a personal account:
      # PROJECT_TOKEN is a classic token with the `project` scope.
      # Event values go through env, never straight into the script line.
      - run: .github/scripts/roadmap-dates.sh "$ISSUE_ID" "$CREATED_AT" "$CLOSED_AT"
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: 3
          ISSUE_ID: ${{ github.event.issue.node_id }}
          CREATED_AT: ${{ github.event.issue.created_at }}
          CLOSED_AT: ${{ github.event.issue.closed_at }}
