name: roadmap dates

on:
  issues:
    types: [closed, reopened]
  # Moving a card in a personal project triggers nothing: a daily pass picks up
  # the cards that entered In Progress. 04:17 UTC, off the busy top of the hour.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two passes at once would only write the same values twice.
concurrency: roadmap-dates

jobs:
  dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GITHUB_TOKEN cannot reach a project owned by a personal account:
      # PROJECT_TOKEN is a classic token with the `project` scope.
      - run: .github/scripts/roadmap-dates.sh
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: 3
