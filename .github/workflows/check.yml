name: check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; a hung step would otherwise run
    # until GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci

      # settings.py refuses to start without a secret key; mypy's Django plugin
      # and makemigrations both import it.
      - name: Create a throwaway .env
        run: |
          cp backend/.env.example backend/.env
          key=$(python -c "import secrets; print(secrets.token_urlsafe(64))")
          sed -i "s|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=$key|" backend/.env

      - run: make check

      # The backend strips uploaded videos' metadata with it (club/videos.py).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: make test

      # `make check` stops at the types; only the build proves Vite can bundle.
      - run: npm --prefix frontend run build
