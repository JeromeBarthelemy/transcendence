# Layered over compose.prod.yml on a 42 workstation (`make up-campus`):
# rootless Docker there can't publish ports below 1024, and goinfre, which
# holds Docker's own data, has too little room for the CUDA image and the
# models. README, "On a 42 workstation".
services:
  proxy:
    # !override, not a plain list: Compose appends ports from a second file,
    # and 80/443 would still be refused. No plain-HTTP port: Caddy's redirect
    # drops the port, so it would send the browser to 443.
    ports: !override
      - "8443:443"

  backend:
    volumes:
      # Same target as compose.prod.yml's fastembed_cache, so it replaces it;
      # fastembed adds its own fastembed/ below it (club/rag.py). sgoinfre is
      # NFS, which refuses Docker's image layers but accepts these plain
      # files: the container's root is the user on the host.
      - /sgoinfre/${USER}/fieldnotes-models:/app/.cache

  ollama:
    # No CUDA libraries: half the CUDA image's size. No GPU either — rootless
    # Docker can't open the AMD card's devices — so it runs on the CPU.
    image: ollama/ollama:0.40.0-rocm
    # The workstations run their own Ollama on 11434; backend reaches this
    # one over the Compose network, which needs no host port.
    ports: !reset []
    # compose.prod.yml's flash attention and q8_0 cache were measured on a
    # GPU; on this CPU they slow reading the prompt by a third (85 against
    # 118 tokens/s). Ollama's defaults instead.
    environment:
      OLLAMA_FLASH_ATTENTION: "0"
      OLLAMA_KV_CACHE_TYPE: f16
    volumes:
      - /sgoinfre/${USER}/fieldnotes-models/ollama:/root/.ollama

  ollama-pull:
    image: ollama/ollama:0.40.0-rocm
