<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1285" role="img"
     aria-labelledby="t d" font-family="IBM Plex Mono, ui-monospace, monospace">
  <title id="t">Socle club et traces — schéma relationnel</title>
  <desc id="d">Sept tables : Season, Team et TeamSeason qui les croise ; Membership qui
  rattache un User à une TeamSeason ; User, et la VerificationRequest qu'il dépose à
  l'inscription ; Consent, journal des décisions de droit à l'image. Puis les traces :
  WorkItem, le chantier d'une TeamSeason ; Entry, la trace qu'un User écrit, rattachée
  ou non à un chantier ; EntryParticipant, qui s'est inscrit à une avancée.</desc>

  <style>
    .bx   { fill:none; stroke:currentColor; stroke-width:1.3 }
    .sep  { stroke:currentColor; stroke-width:1; opacity:.45 }
    .ttl  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:15px; font-weight:700; fill:currentColor }
    .col  { font-size:12px; fill:currentColor }
    .ann  { font-size:11px; fill:currentColor; opacity:.6 }
    .lnk  { stroke:currentColor; stroke-width:1.3; fill:none }
    .crow { stroke:currentColor; stroke-width:1.3; fill:none }
    .cap  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:11px; fill:currentColor; opacity:.7 }
    .lgt  { font-size:11.5px; fill:currentColor; font-weight:600 }
    .lgd  { font-size:11.5px; fill:currentColor; opacity:.72 }
  </style>

  <!-- ============================ Season ============================ -->
  <rect class="bx" x="30" y="40" width="230" height="93" rx="3"/>
  <line class="sep" x1="30" y1="66" x2="260" y2="66"/>
  <text class="ttl" x="42" y="59">Season</text>
  <text class="col" x="42" y="85">id</text>          <text class="ann" x="150" y="85">PK</text>
  <text class="col" x="42" y="104">start_year</text> <text class="ann" x="150" y="104">UNIQUE</text>
  <text class="col" x="42" y="123">game_name</text>  <text class="ann" x="150" y="123">UNIQUE</text>
  <text class="cap" x="30" y="150">l'année de fin est toujours la suivante</text>
  <text class="cap" x="30" y="166">FIRST ne réutilise jamais un nom de jeu</text>

  <!-- ========================== TeamSeason ========================== -->
  <rect class="bx" x="400" y="30" width="250" height="112" rx="3"/>
  <line class="sep" x1="400" y1="56" x2="650" y2="56"/>
  <text class="ttl" x="412" y="49">TeamSeason</text>
  <text class="col" x="412" y="75">id</text>           <text class="ann" x="545" y="75">PK</text>
  <text class="col" x="412" y="94">team_id</text>      <text class="ann" x="545" y="94">FK PROTECT</text>
  <text class="col" x="412" y="113">season_id</text>   <text class="ann" x="545" y="113">FK PROTECT</text>
  <text class="ann" x="412" y="132">UNIQUE (team_id, season_id)</text>

  <!-- ============================= Team ============================= -->
  <rect class="bx" x="800" y="40" width="230" height="93" rx="3"/>
  <line class="sep" x1="800" y1="66" x2="1030" y2="66"/>
  <text class="ttl" x="812" y="59">Team</text>
  <text class="col" x="812" y="85">id</text>       <text class="ann" x="920" y="85">PK</text>
  <text class="col" x="812" y="104">number</text>  <text class="ann" x="920" y="104">UNIQUE</text>
  <text class="col" x="812" y="123">name</text>
  <text class="cap" x="800" y="150">numéro attribué par FIRST</text>

  <!-- ========================== Membership ========================== -->
  <rect class="bx" x="400" y="210" width="250" height="112" rx="3"/>
  <line class="sep" x1="400" y1="236" x2="650" y2="236"/>
  <text class="ttl" x="412" y="229">Membership</text>
  <text class="col" x="412" y="255">id</text>              <text class="ann" x="560" y="255">PK</text>
  <text class="col" x="412" y="274">user_id</text>         <text class="ann" x="560" y="274">FK CASCADE</text>
  <text class="col" x="412" y="293">team_season_id</text>  <text class="ann" x="560" y="293">FK CASCADE</text>
  <text class="ann" x="412" y="312">UNIQUE (user_id, team_season_id)</text>
  <text class="cap" x="672" y="272">lien pur — plus aucun rôle</text>

  <!-- ====================== VerificationRequest ===================== -->
  <rect class="bx" x="30" y="380" width="250" height="172" rx="3"/>
  <line class="sep" x1="30" y1="406" x2="280" y2="406"/>
  <text class="ttl" x="42" y="399">VerificationRequest</text>
  <text class="col" x="42" y="425">id</text>          <text class="ann" x="170" y="425">PK</text>
  <text class="col" x="42" y="444">user_id</text>     <text class="ann" x="170" y="444">FK CASCADE</text>
  <text class="col" x="42" y="463">last_name</text>
  <text class="col" x="42" y="482">first_name</text>
  <text class="col" x="42" y="501">birth_date</text>
  <text class="col" x="42" y="520">created_at</text>
  <text class="ann" x="42" y="539">UNIQUE (user_id)</text>
  <text class="cap" x="30" y="574">ce que l'inscription a tapé, pour retrouver</text>
  <text class="cap" x="30" y="590">l'adhésion AssoConnect — supprimée sitôt vérifiée</text>
  <text class="cap" x="30" y="606">la date déclarée ne décide jamais de la majorité</text>

  <!-- ============================= User ============================= -->
  <rect class="bx" x="330" y="380" width="340" height="291" rx="3"/>
  <line class="sep" x1="330" y1="406" x2="670" y2="406"/>
  <text class="ttl" x="342" y="399">User</text>
  <text class="col" x="342" y="425">id</text>              <text class="ann" x="545" y="425">PK</text>
  <text class="col" x="342" y="444">email</text>           <text class="ann" x="545" y="444">UNIQUE</text>
  <text class="col" x="342" y="463">display_name</text>
  <text class="col" x="342" y="482">display_name_folded</text> <text class="ann" x="545" y="482">UNIQUE</text>
  
  <text class="col" x="342" y="501">contact_email</text>   <text class="ann" x="545" y="501">optionnel</text>
  <text class="col" x="342" y="520">avatar</text>          <text class="ann" x="545" y="520">optionnel</text>
  <text class="col" x="342" y="539">assoconnect_id</text>  <text class="ann" x="545" y="539">UNIQUE, nullable</text>
  <text class="col" x="342" y="558">birth_date</text>      <text class="ann" x="545" y="558">nullable</text>
  <text class="col" x="342" y="577">club_role</text>       <text class="ann" x="545" y="577">student | mentor</text>
  <text class="col" x="342" y="596">is_club_admin</text>   <text class="ann" x="545" y="596">default FALSE</text>
  <text class="col" x="342" y="615">is_active, is_staff</text>
  <text class="col" x="342" y="634">date_joined</text>
  <text class="ann" x="342" y="653">+ AbstractBaseUser, PermissionsMixin</text>
  <text class="cap" x="360" y="693">email et display_name identifient — on n'écrit qu'à contact_email</text>
  <text class="cap" x="360" y="709">is_minor se calcule de birth_date vérifiée, il n'est pas stocké</text>

  <!-- ============================ Consent =========================== -->
  <rect class="bx" x="760" y="380" width="270" height="150" rx="3"/>
  <line class="sep" x1="760" y1="406" x2="1030" y2="406"/>
  <text class="ttl" x="772" y="399">Consent</text>
  <text class="col" x="772" y="425">id</text>          <text class="ann" x="895" y="425">PK</text>
  <text class="col" x="772" y="444">user_id</text>     <text class="ann" x="895" y="444">FK CASCADE</text>
  <text class="col" x="772" y="463">decision</text>    <text class="ann" x="895" y="463">granted | refused</text>
  <text class="col" x="772" y="482">granted_by</text>  <text class="ann" x="895" y="482">self | tuteur</text>
  <text class="col" x="772" y="501">decided_at</text>
  <text class="cap" x="760" y="552">droit à l'image — journal de décisions, jamais réécrit</text>
  <text class="cap" x="760" y="568">aucune unicité : la dernière ligne est celle en vigueur</text>
  <text class="cap" x="760" y="584">aucune décision du tout ≠ un refus</text>

  <!-- ====================== Season —&lt; TeamSeason ==================== -->
  <line class="lnk" x1="260" y1="86" x2="400" y2="86"/>
  <line class="crow" x1="266" y1="79" x2="266" y2="93"/>
  <path class="crow" d="M388,86 L400,78 M388,86 L400,86 M388,86 L400,94"/>

  <!-- ======================= TeamSeason &gt;— Team ===================== -->
  <line class="lnk" x1="650" y1="86" x2="800" y2="86"/>
  <line class="crow" x1="794" y1="79" x2="794" y2="93"/>
  <path class="crow" d="M662,86 L650,78 M662,86 L650,86 M662,86 L650,94"/>

  <!-- ==================== TeamSeason —&lt; Membership ================== -->
  <line class="lnk" x1="525" y1="142" x2="525" y2="210"/>
  <line class="crow" x1="518" y1="148" x2="532" y2="148"/>
  <path class="crow" d="M525,198 L517,210 M525,198 L525,210 M525,198 L533,210"/>

  <!-- ======================= User —&lt; Membership ===================== -->
  <line class="lnk" x1="525" y1="322" x2="525" y2="380"/>
  <line class="crow" x1="518" y1="374" x2="532" y2="374"/>
  <path class="crow" d="M525,334 L517,322 M525,334 L525,322 M525,334 L533,322"/>

  <!-- ====================== User —&lt; Consent (×n) ==================== -->
  <line class="lnk" x1="670" y1="430" x2="760" y2="430"/>
  <line class="crow" x1="676" y1="423" x2="676" y2="437"/>
  <path class="crow" d="M748,430 L760,422 M748,430 L760,430 M748,430 L760,438"/>

  <!-- ================= VerificationRequest —— User (1–1) ============= -->
  <line class="lnk" x1="280" y1="430" x2="330" y2="430"/>
  <line class="crow" x1="286" y1="423" x2="286" y2="437"/>
  <line class="crow" x1="324" y1="423" x2="324" y2="437"/>

  <!-- =========================== WorkItem =========================== -->
  <rect class="bx" x="30" y="750" width="270" height="226" rx="3"/>
  <line class="sep" x1="30" y1="776" x2="300" y2="776"/>
  <text class="ttl" x="42" y="769">WorkItem</text>
  <text class="col" x="42" y="795">id</text>              <text class="ann" x="170" y="795">PK</text>
  <text class="col" x="42" y="814">team_season_id</text>  <text class="ann" x="170" y="814">FK PROTECT</text>
  <text class="col" x="42" y="833">title</text>
  <text class="col" x="42" y="852">title_folded</text>
  <text class="col" x="42" y="871">on_robot</text>
  <text class="col" x="42" y="890">status</text>
  <text class="col" x="42" y="909">opened_at</text>       <text class="ann" x="170" y="909">nullable</text>
  <text class="col" x="42" y="928">closed_at</text>       <text class="ann" x="170" y="928">nullable</text>
  <text class="col" x="42" y="947">handover</text>
  <text class="ann" x="42" y="966">UNIQUE (team_season_id, title_folded)</text>
  <text class="cap" x="30" y="998">le chantier ; au robot, titre = sous-système</text>
  <text class="cap" x="30" y="1014">status : suggested · open · done · dropped</text>
  <text class="cap" x="30" y="1030">l'étape courante se lit sur la dernière avancée</text>

  <!-- ============================= Entry ============================ -->
  <rect class="bx" x="330" y="750" width="340" height="245" rx="3"/>
  <line class="sep" x1="330" y1="776" x2="670" y2="776"/>
  <text class="ttl" x="342" y="769">Entry</text>
  <text class="col" x="360" y="795">id</text>              <text class="ann" x="520" y="795">PK</text>
  <text class="col" x="360" y="814">team_season_id</text>  <text class="ann" x="520" y="814">FK PROTECT</text>
  <text class="col" x="360" y="833">author_id</text>       <text class="ann" x="520" y="833">FK PROTECT</text>
  <text class="col" x="360" y="852">work_item_id</text>    <text class="ann" x="520" y="852">FK PROTECT, nullable</text>
  <text class="col" x="360" y="871">type</text>
  <text class="col" x="360" y="890">body</text>
  <text class="col" x="360" y="909">step</text>            <text class="ann" x="520" y="909">nullable</text>
  <text class="col" x="360" y="928">occurred_at</text>
  <text class="col" x="360" y="947">created_at</text>
  <text class="col" x="360" y="966">updated_at</text>      <text class="ann" x="520" y="966">nullable</text>
  <text class="col" x="360" y="985">updated_by</text>      <text class="ann" x="520" y="985">FK PROTECT, nullable</text>
  <text class="cap" x="330" y="1017">la trace : type progress (avancée) · note · decision</text>
  <text class="cap" x="330" y="1033">step : l'étape de l'avancée, vide hors robot</text>
  <text class="cap" x="330" y="1049">team_season_id pointe TeamSeason, comme celui de WorkItem</text>

  <!-- ======================== EntryParticipant ====================== -->
  <rect class="bx" x="760" y="750" width="270" height="112" rx="3"/>
  <line class="sep" x1="760" y1="776" x2="1030" y2="776"/>
  <text class="ttl" x="772" y="769">EntryParticipant</text>
  <text class="col" x="772" y="795">id</text>        <text class="ann" x="880" y="795">PK</text>
  <text class="col" x="772" y="814">entry_id</text>  <text class="ann" x="880" y="814">FK CASCADE</text>
  <text class="col" x="772" y="833">user_id</text>   <text class="ann" x="880" y="833">FK PROTECT</text>
  <text class="ann" x="772" y="852">UNIQUE (entry_id, user_id)</text>
  <text class="cap" x="760" y="884">chacun s'inscrit soi-même à une avancée</text>
  <text class="cap" x="760" y="900">la présence du jour se lit ici, nulle part ailleurs</text>

  <!-- ======================= WorkItem —&lt; Entry ====================== -->
  <line class="lnk" x1="300" y1="852" x2="330" y2="852"/>
  <line class="crow" x1="305" y1="845" x2="305" y2="859"/>
  <path class="crow" d="M318,852 L330,844 M318,852 L330,852 M318,852 L330,860"/>

  <!-- ==================== Entry —&lt; EntryParticipant ================= -->
  <line class="lnk" x1="670" y1="814" x2="760" y2="814"/>
  <line class="crow" x1="676" y1="807" x2="676" y2="821"/>
  <path class="crow" d="M748,814 L760,806 M748,814 L760,814 M748,814 L760,822"/>

  <!-- ===================== User —&lt; Entry (auteur) ==================== -->
  <line class="lnk" x1="345" y1="671" x2="345" y2="750"/>
  <line class="crow" x1="338" y1="677" x2="352" y2="677"/>
  <path class="crow" d="M345,738 L337,750 M345,738 L345,750 M345,738 L353,750"/>

  <!-- ================== User —&lt; EntryParticipant ==================== -->
  <path class="lnk" d="M670,640 H900 V750"/>
  <line class="crow" x1="676" y1="633" x2="676" y2="647"/>
  <path class="crow" d="M900,738 L892,750 M900,738 L900,750 M900,738 L908,750"/>

  <!-- ============================ légende =========================== -->
  <rect class="bx" x="30" y="1070" width="1000" height="190" rx="3"/>
  <line class="sep" x1="30" y1="1096" x2="1030" y2="1096"/>
  <text class="ttl" x="42" y="1089">Légende</text>

  <text class="lgt" x="45"  y="1120">PK</text>
  <text class="lgd" x="150" y="1120">identifie une ligne, de façon unique</text>
  <text class="lgt" x="45"  y="1139">FK</text>
  <text class="lgd" x="150" y="1139">pointe vers la clé primaire d'une autre table</text>
  <text class="lgt" x="45"  y="1158">nullable</text>
  <text class="lgd" x="150" y="1158">la colonne peut rester vide</text>
  <text class="lgt" x="45"  y="1177">UNIQUE</text>
  <text class="lgd" x="150" y="1177">ne peut exister qu'une seule fois</text>

  <text class="lgt" x="560" y="1120">CASCADE</text>
  <text class="lgd" x="690" y="1120">supprime les lignes qui pointent la cible</text>
  <text class="lgt" x="560" y="1139">PROTECT</text>
  <text class="lgd" x="690" y="1139">refuse la suppression de la cible</text>
  <text class="lgt" x="560" y="1158">_folded</text>
  <text class="lgd" x="690" y="1158">replié pour comparer : Lina = lina, Électro = electro</text>

  <line class="sep" x1="45" y1="1194" x2="1015" y2="1194"/>

  <line class="crow" x1="52" y1="1215" x2="52" y2="1227"/>
  <line class="lnk" x1="52" y1="1221" x2="86" y2="1221"/>
  <text class="lgd" x="96" y="1225">côté « exactement un »</text>
  <line class="lnk" x1="560" y1="1221" x2="594" y2="1221"/>
  <path class="crow" d="M582,1221 L594,1214 M582,1221 L594,1221 M582,1221 L594,1228"/>
  <text class="lgd" x="604" y="1225">côté « plusieurs » — une Season, plusieurs TeamSeason</text>

  <line class="lnk" x1="52" y1="1245" x2="86" y2="1245"/>
  <line class="crow" x1="54" y1="1239" x2="54" y2="1251"/>
  <line class="crow" x1="84" y1="1239" x2="84" y2="1251"/>
  <text class="lgd" x="96" y="1249">un de chaque côté — un compte, au plus une demande de vérification</text>

</svg>
