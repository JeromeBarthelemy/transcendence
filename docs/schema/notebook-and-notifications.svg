<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 851" role="img"
     aria-labelledby="t d" font-family="IBM Plex Mono, ui-monospace, monospace">
  <title id="t">Notebook and notifications</title>
  <desc id="d">WorkItem, a team season's work item; Entry, the trace a member writes, tied to a work item or not; EntryParticipant, who joined a progress entry; Attachment, the files of an entry; Notification, a board change for each person it concerns.</desc>

  <style>
    .bg   { fill:#ffffff }
    .bx   { fill:#ffffff; stroke:#1f2933; stroke-width:1.3 }
    .sep  { stroke:#1f2933; stroke-width:1; opacity:.45 }
    .ttl  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:15px; font-weight:700; fill:#1f2933 }
    .col  { font-size:12px; fill:#1f2933 }
    .typ  { font-size:11px; fill:#3e6aa8 }
    .ann  { font-size:11px; fill:#1f2933; opacity:.6 }
    .lnk  { stroke:#1f2933; stroke-width:1.3; fill:none }
    .cap  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:11.5px; fill:#1f2933; opacity:.75 }
    .head { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:18px; font-weight:700; fill:#1f2933 }
    .lgt  { font-size:11.5px; fill:#1f2933; font-weight:600 }
    .lgd  { font-size:11.5px; fill:#1f2933; opacity:.75 }
  </style>

  <rect class="bg" width="1408" height="851"/>
  <text class="head" x="30" y="34">Notebook and notifications</text>

  <!-- WorkItem -->
  <rect class="bx" x="30" y="60" width="395" height="209" rx="3"/>
  <line class="sep" x1="30" y1="86" x2="425" y2="86"/>
  <text class="ttl" x="42" y="79">WorkItem</text>
  <text class="col" x="42" y="105">id</text> <text class="typ" x="158" y="105">bigint</text> <text class="ann" x="253" y="105">PK</text>
  <text class="col" x="42" y="124">team_season_id</text> <text class="typ" x="158" y="124">bigint</text> <text class="ann" x="253" y="124">FK → TeamSeason, PROTECT</text>
  <text class="col" x="42" y="143">title</text> <text class="typ" x="158" y="143">varchar(120)</text>
  <text class="col" x="42" y="162">title_folded</text> <text class="typ" x="158" y="162">varchar(240)</text>
  <text class="col" x="42" y="181">on_robot</text> <text class="typ" x="158" y="181">bool</text> <text class="ann" x="253" y="181">default FALSE</text>
  <text class="col" x="42" y="200">status</text> <text class="typ" x="158" y="200">varchar(10)</text> <text class="ann" x="253" y="200">open | done | dropped</text>
  <text class="col" x="42" y="219">opened_at</text> <text class="typ" x="158" y="219">datetime</text>
  <text class="col" x="42" y="238">closed_at</text> <text class="typ" x="158" y="238">datetime</text> <text class="ann" x="253" y="238">null</text>
  <text class="ann" x="42" y="257">UNIQUE (team_season_id, title_folded)</text>
  <text class="cap" x="30" y="291">a work item; on the robot, its title</text>
  <text class="cap" x="30" y="307">is the subsystem</text>
  <text class="cap" x="30" y="323">its current step is read from</text>
  <text class="cap" x="30" y="339">the latest progress entry</text>
  <!-- Entry -->
  <rect class="bx" x="495" y="60" width="415" height="304" rx="3"/>
  <line class="sep" x1="495" y1="86" x2="910" y2="86"/>
  <text class="ttl" x="507" y="79">Entry</text>
  <text class="col" x="507" y="105">id</text> <text class="typ" x="623" y="105">bigint</text> <text class="ann" x="711" y="105">PK</text>
  <text class="col" x="507" y="124">team_season_id</text> <text class="typ" x="623" y="124">bigint</text> <text class="ann" x="711" y="124">FK → TeamSeason, PROTECT</text>
  <text class="col" x="507" y="143">author_id</text> <text class="typ" x="623" y="143">bigint</text> <text class="ann" x="711" y="143">FK → User, PROTECT</text>
  <text class="col" x="507" y="162">work_item_id</text> <text class="typ" x="623" y="162">bigint</text> <text class="ann" x="711" y="162">FK → WorkItem, PROTECT, null</text>
  <text class="col" x="507" y="181">type</text> <text class="typ" x="623" y="181">varchar(10)</text> <text class="ann" x="711" y="181">progress | note | decision</text>
  <text class="col" x="507" y="200">body</text> <text class="typ" x="623" y="200">text</text>
  <text class="col" x="507" y="219">handover</text> <text class="typ" x="623" y="219">text</text>
  <text class="col" x="507" y="238">step</text> <text class="typ" x="623" y="238">varchar(15)</text> <text class="ann" x="711" y="238">null</text>
  <text class="col" x="507" y="257">occurred_at</text> <text class="typ" x="623" y="257">datetime</text>
  <text class="col" x="507" y="276">created_at</text> <text class="typ" x="623" y="276">datetime</text>
  <text class="col" x="507" y="295">updated_at</text> <text class="typ" x="623" y="295">datetime</text> <text class="ann" x="711" y="295">null</text>
  <text class="col" x="507" y="314">updated_by_id</text> <text class="typ" x="623" y="314">bigint</text> <text class="ann" x="711" y="314">FK → User, PROTECT, null</text>
  <text class="col" x="507" y="333">client_id</text> <text class="typ" x="623" y="333">uuid</text> <text class="ann" x="711" y="333">null</text>
  <text class="ann" x="507" y="352">UNIQUE (author_id, client_id) where client_id is set</text>
  <text class="cap" x="495" y="386">an entry: progress, note or decision; step is empty off the robot</text>
  <text class="cap" x="495" y="402">handover: what the next session needs to know</text>
  <text class="cap" x="495" y="418">client_id: a note replayed after a lost connection is kept once</text>
  <!-- EntryParticipant -->
  <rect class="bx" x="980" y="60" width="277" height="114" rx="3"/>
  <line class="sep" x1="980" y1="86" x2="1257" y2="86"/>
  <text class="ttl" x="992" y="79">EntryParticipant</text>
  <text class="col" x="992" y="105">id</text> <text class="typ" x="1064" y="105">bigint</text> <text class="ann" x="1119" y="105">PK</text>
  <text class="col" x="992" y="124">entry_id</text> <text class="typ" x="1064" y="124">bigint</text> <text class="ann" x="1119" y="124">FK → Entry, CASCADE</text>
  <text class="col" x="992" y="143">user_id</text> <text class="typ" x="1064" y="143">bigint</text> <text class="ann" x="1119" y="143">FK → User, PROTECT</text>
  <text class="ann" x="992" y="162">UNIQUE (entry_id, user_id)</text>
  <text class="cap" x="980" y="196">members join a progress entry themselves;</text>
  <text class="cap" x="980" y="212">the day's attendance is read here only</text>
  <!-- Attachment -->
  <rect class="bx" x="980" y="264" width="398" height="190" rx="3"/>
  <line class="sep" x1="980" y1="290" x2="1378" y2="290"/>
  <text class="ttl" x="992" y="283">Attachment</text>
  <text class="col" x="992" y="309">id</text> <text class="typ" x="1145" y="309">bigint</text> <text class="ann" x="1239" y="309">PK</text>
  <text class="col" x="992" y="328">entry_id</text> <text class="typ" x="1145" y="328">bigint</text> <text class="ann" x="1239" y="328">FK → Entry, CASCADE</text>
  <text class="col" x="992" y="347">uploaded_by_id</text> <text class="typ" x="1145" y="347">bigint</text> <text class="ann" x="1239" y="347">FK → User, PROTECT</text>
  <text class="col" x="992" y="366">file</text> <text class="typ" x="1145" y="366">varchar(100)</text> <text class="ann" x="1239" y="366">path under media/</text>
  <text class="col" x="992" y="385">name</text> <text class="typ" x="1145" y="385">varchar(255)</text>
  <text class="col" x="992" y="404">content_type</text> <text class="typ" x="1145" y="404">varchar(50)</text>
  <text class="col" x="992" y="423">people_recognisable</text> <text class="typ" x="1145" y="423">bool</text> <text class="ann" x="1239" y="423">default FALSE</text>
  <text class="col" x="992" y="442">uploaded_at</text> <text class="typ" x="1145" y="442">datetime</text>
  <text class="cap" x="980" y="476">a file attached to an entry; it leaves the disk</text>
  <text class="cap" x="980" y="492">with it. people_recognisable: someone can be</text>
  <text class="cap" x="980" y="508">recognised in it (image rights)</text>
  <!-- Notification -->
  <rect class="bx" x="495" y="564" width="436" height="247" rx="3"/>
  <line class="sep" x1="495" y1="590" x2="931" y2="590"/>
  <text class="ttl" x="507" y="583">Notification</text>
  <text class="col" x="507" y="609">id</text> <text class="typ" x="630" y="609">bigint</text> <text class="ann" x="725" y="609">PK</text>
  <text class="col" x="507" y="628">recipient_id</text> <text class="typ" x="630" y="628">bigint</text> <text class="ann" x="725" y="628">FK → User, CASCADE</text>
  <text class="col" x="507" y="647">actor_id</text> <text class="typ" x="630" y="647">bigint</text> <text class="ann" x="725" y="647">FK → User, PROTECT</text>
  <text class="col" x="507" y="666">team_season_id</text> <text class="typ" x="630" y="666">bigint</text> <text class="ann" x="725" y="666">FK → TeamSeason, CASCADE</text>
  <text class="col" x="507" y="685">verb</text> <text class="typ" x="630" y="685">varchar(20)</text>
  <text class="col" x="507" y="704">work_item_id</text> <text class="typ" x="630" y="704">bigint</text> <text class="ann" x="725" y="704">FK → WorkItem, SET_NULL, null</text>
  <text class="col" x="507" y="723">work_item_title</text> <text class="typ" x="630" y="723">varchar(120)</text>
  <text class="col" x="507" y="742">entry_id</text> <text class="typ" x="630" y="742">bigint</text> <text class="ann" x="725" y="742">FK → Entry, SET_NULL, null</text>
  <text class="col" x="507" y="761">entry_type</text> <text class="typ" x="630" y="761">varchar(10)</text> <text class="ann" x="725" y="761">null</text>
  <text class="col" x="507" y="780">created_at</text> <text class="typ" x="630" y="780">datetime</text>
  <text class="col" x="507" y="799">read_at</text> <text class="typ" x="630" y="799">datetime</text> <text class="ann" x="725" y="799">null</text>
  <text class="cap" x="961" y="584">a board change, for each person it concerns</text>
  <text class="cap" x="961" y="600">verb: work item opened, done, dropped, reopened, deleted;</text>
  <text class="cap" x="961" y="616">entry added, updated, removed</text>
  <text class="cap" x="961" y="632">SET_NULL: the notification outlives what it announces,</text>
  <text class="cap" x="961" y="648">and work_item_title keeps a deleted work item's title</text>
  <text class="cap" x="961" y="664">read_at empty: unread; once read and out of the</text>
  <text class="cap" x="961" y="680">latest 20 shown, it is deleted</text>
  <line class="lnk" x1="425" y1="158" x2="495" y2="158"/>
  <line class="lnk" x1="431" y1="151" x2="431" y2="165"/>
  <path class="lnk" d="M483,158 L495,150 M483,158 L495,158 M483,158 L495,166"/>
  <line class="lnk" x1="910" y1="120" x2="980" y2="120"/>
  <line class="lnk" x1="916" y1="113" x2="916" y2="127"/>
  <path class="lnk" d="M968,120 L980,112 M968,120 L980,120 M968,120 L980,128"/>
  <line class="lnk" x1="910" y1="324" x2="980" y2="324"/>
  <line class="lnk" x1="916" y1="317" x2="916" y2="331"/>
  <path class="lnk" d="M968,324 L980,316 M968,324 L980,324 M968,324 L980,332"/>
  <line class="lnk" x1="895" y1="364" x2="895" y2="564"/>
  <line class="lnk" x1="888" y1="370" x2="902" y2="370"/>
  <path class="lnk" d="M895,552 L887,564 M895,552 L895,564 M895,552 L903,564"/>
  <path class="lnk" d="M395,269 V700 H495"/>
  <line class="lnk" x1="388" y1="275" x2="402" y2="275"/>
  <path class="lnk" d="M483,700 L495,692 M483,700 L495,700 M483,700 L495,708"/>
</svg>
