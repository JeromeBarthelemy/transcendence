<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1308 571" role="img"
     aria-labelledby="t d" font-family="IBM Plex Mono, ui-monospace, monospace">
  <title id="t">Rulebook (Fieldbot)</title>
  <desc id="d">Document, one version of the game manual or the official Q&amp;A; Chunk and GlossaryTerm, its passages and glossary; SourceUpdate, a version waiting for acceptance; RuleQuery and QueryCitation, a question asked and the passages cited.</desc>

  <style>
    .bg   { fill:#ffffff }
    .bx   { fill:#ffffff; stroke:#1f2933; stroke-width:1.3 }
    .sep  { stroke:#1f2933; stroke-width:1; opacity:.45 }
    .ttl  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:15px; font-weight:700; fill:#1f2933 }
    .col  { font-size:12px; fill:#1f2933 }
    .typ  { font-size:11px; fill:#3e6aa8 }
    .ann  { font-size:11px; fill:#1f2933; opacity:.6 }
    .lnk  { stroke:#1f2933; stroke-width:1.3; fill:none }
    .cap  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:11.5px; fill:#1f2933; opacity:.75 }
    .head { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:18px; font-weight:700; fill:#1f2933 }
    .lgt  { font-size:11.5px; fill:#1f2933; font-weight:600 }
    .lgd  { font-size:11.5px; fill:#1f2933; opacity:.75 }
  </style>

  <rect class="bg" width="1308" height="571"/>
  <text class="head" x="30" y="34">Rulebook (Fieldbot)</text>

  <!-- Document -->
  <rect class="bx" x="30" y="60" width="387" height="209" rx="3"/>
  <line class="sep" x1="30" y1="86" x2="417" y2="86"/>
  <text class="ttl" x="42" y="79">Document</text>
  <text class="col" x="42" y="105">id</text> <text class="typ" x="144" y="105">bigint</text> <text class="ann" x="238" y="105">PK</text>
  <text class="col" x="42" y="124">season_id</text> <text class="typ" x="144" y="124">bigint</text> <text class="ann" x="238" y="124">FK → Season, PROTECT</text>
  <text class="col" x="42" y="143">source</text> <text class="typ" x="144" y="143">varchar(15)</text> <text class="ann" x="238" y="143">game_manual | official_qa</text>
  <text class="col" x="42" y="162">authority</text> <text class="typ" x="144" y="162">varchar(10)</text> <text class="ann" x="238" y="162">binding | ruling</text>
  <text class="col" x="42" y="181">title</text> <text class="typ" x="144" y="181">varchar(200)</text>
  <text class="col" x="42" y="200">url</text> <text class="typ" x="144" y="200">varchar(200)</text>
  <text class="col" x="42" y="219">fetched_at</text> <text class="typ" x="144" y="219">datetime</text>
  <text class="col" x="42" y="238">content_hash</text> <text class="typ" x="144" y="238">varchar(64)</text>
  <text class="col" x="42" y="257">checked_at</text> <text class="typ" x="144" y="257">datetime</text> <text class="ann" x="238" y="257">null</text>
  <text class="cap" x="30" y="291">one published version of a source; only the</text>
  <text class="cap" x="30" y="307">latest per season and source is searched</text>
  <!-- Chunk -->
  <rect class="bx" x="487" y="60" width="353" height="190" rx="3"/>
  <line class="sep" x1="487" y1="86" x2="840" y2="86"/>
  <text class="ttl" x="499" y="79">Chunk</text>
  <text class="col" x="499" y="105">id</text> <text class="typ" x="593" y="105">bigint</text> <text class="ann" x="681" y="105">PK</text>
  <text class="col" x="499" y="124">document_id</text> <text class="typ" x="593" y="124">bigint</text> <text class="ann" x="681" y="124">FK → Document, CASCADE</text>
  <text class="col" x="499" y="143">ordinal</text> <text class="typ" x="593" y="143">int</text>
  <text class="col" x="499" y="162">reference</text> <text class="typ" x="593" y="162">varchar(20)</text> <text class="ann" x="681" y="162">e.g. G102, 11.3.4</text>
  <text class="col" x="499" y="181">anchor</text> <text class="typ" x="593" y="181">varchar(30)</text>
  <text class="col" x="499" y="200">text</text> <text class="typ" x="593" y="200">text</text>
  <text class="col" x="499" y="219">embedding</text> <text class="typ" x="593" y="219">blob</text> <text class="ann" x="681" y="219">768 floats</text>
  <text class="ann" x="499" y="238">UNIQUE (document_id, ordinal)</text>
  <text class="cap" x="487" y="272">a passage, searched by its embedding</text>
  <!-- SourceUpdate -->
  <rect class="bx" x="910" y="60" width="368" height="209" rx="3"/>
  <line class="sep" x1="910" y1="86" x2="1278" y2="86"/>
  <text class="ttl" x="922" y="79">SourceUpdate</text>
  <text class="col" x="922" y="105">id</text> <text class="typ" x="1038" y="105">bigint</text> <text class="ann" x="1133" y="105">PK</text>
  <text class="col" x="922" y="124">season_id</text> <text class="typ" x="1038" y="124">bigint</text> <text class="ann" x="1133" y="124">FK → Season, CASCADE</text>
  <text class="col" x="922" y="143">source</text> <text class="typ" x="1038" y="143">varchar(15)</text>
  <text class="col" x="922" y="162">url</text> <text class="typ" x="1038" y="162">varchar(200)</text>
  <text class="col" x="922" y="181">content_hash</text> <text class="typ" x="1038" y="181">varchar(64)</text>
  <text class="col" x="922" y="200">candidate_text</text> <text class="typ" x="1038" y="200">text</text>
  <text class="col" x="922" y="219">summary</text> <text class="typ" x="1038" y="219">json</text>
  <text class="col" x="922" y="238">detected_at</text> <text class="typ" x="1038" y="238">datetime</text>
  <text class="ann" x="922" y="257">UNIQUE (season_id, source)</text>
  <text class="cap" x="910" y="291">at most one version waiting per source;</text>
  <text class="cap" x="910" y="307">once accepted, it becomes a Document</text>
  <!-- GlossaryTerm -->
  <rect class="bx" x="30" y="349" width="353" height="152" rx="3"/>
  <line class="sep" x1="30" y1="375" x2="383" y2="375"/>
  <text class="ttl" x="42" y="368">GlossaryTerm</text>
  <text class="col" x="42" y="394">id</text> <text class="typ" x="136" y="394">bigint</text> <text class="ann" x="224" y="394">PK</text>
  <text class="col" x="42" y="413">document_id</text> <text class="typ" x="136" y="413">bigint</text> <text class="ann" x="224" y="413">FK → Document, CASCADE</text>
  <text class="col" x="42" y="432">ordinal</text> <text class="typ" x="136" y="432">int</text>
  <text class="col" x="42" y="451">term</text> <text class="typ" x="136" y="451">varchar(60)</text>
  <text class="col" x="42" y="470">definition</text> <text class="typ" x="136" y="470">text</text>
  <text class="ann" x="42" y="489">UNIQUE (document_id, ordinal)</text>
  <text class="cap" x="30" y="523">the manual's glossary, read at ingestion</text>
  <!-- QueryCitation -->
  <rect class="bx" x="487" y="349" width="318" height="133" rx="3"/>
  <line class="sep" x1="487" y1="375" x2="805" y2="375"/>
  <text class="ttl" x="499" y="368">QueryCitation</text>
  <text class="col" x="499" y="394">id</text> <text class="typ" x="571" y="394">bigint</text> <text class="ann" x="639" y="394">PK</text>
  <text class="col" x="499" y="413">query_id</text> <text class="typ" x="571" y="413">bigint</text> <text class="ann" x="639" y="413">FK → RuleQuery, CASCADE</text>
  <text class="col" x="499" y="432">chunk_id</text> <text class="typ" x="571" y="432">bigint</text> <text class="ann" x="639" y="432">FK → Chunk, PROTECT</text>
  <text class="col" x="499" y="451">rank</text> <text class="typ" x="571" y="451">smallint</text>
  <text class="ann" x="499" y="470">UNIQUE (query_id, rank)</text>
  <text class="cap" x="487" y="504">rank: the order the passages are shown in</text>
  <!-- RuleQuery -->
  <rect class="bx" x="875" y="349" width="299" height="133" rx="3"/>
  <line class="sep" x1="875" y1="375" x2="1174" y2="375"/>
  <text class="ttl" x="887" y="368">RuleQuery</text>
  <text class="col" x="887" y="394">id</text> <text class="typ" x="974" y="394">bigint</text> <text class="ann" x="1042" y="394">PK</text>
  <text class="col" x="887" y="413">asker_id</text> <text class="typ" x="974" y="413">bigint</text> <text class="ann" x="1042" y="413">FK → User, PROTECT</text>
  <text class="col" x="887" y="432">question</text> <text class="typ" x="974" y="432">text</text>
  <text class="col" x="887" y="451">answer</text> <text class="typ" x="974" y="451">text</text>
  <text class="col" x="887" y="470">created_at</text> <text class="typ" x="974" y="470">datetime</text>
  <text class="cap" x="875" y="504">a question asked, and its answer</text>
  <line class="lnk" x1="417" y1="120" x2="487" y2="120"/>
  <line class="lnk" x1="423" y1="113" x2="423" y2="127"/>
  <path class="lnk" d="M475,120 L487,112 M475,120 L487,120 M475,120 L487,128"/>
  <line class="lnk" x1="365" y1="269" x2="365" y2="349"/>
  <line class="lnk" x1="358" y1="275" x2="372" y2="275"/>
  <path class="lnk" d="M365,337 L357,349 M365,337 L365,349 M365,337 L373,349"/>
  <line class="lnk" x1="787" y1="250" x2="787" y2="349"/>
  <line class="lnk" x1="780" y1="256" x2="794" y2="256"/>
  <path class="lnk" d="M787,337 L779,349 M787,337 L787,349 M787,337 L795,349"/>
  <line class="lnk" x1="875" y1="409" x2="805" y2="409"/>
  <line class="lnk" x1="869" y1="402" x2="869" y2="416"/>
  <path class="lnk" d="M817,409 L805,401 M817,409 L805,409 M817,409 L805,417"/>
</svg>
