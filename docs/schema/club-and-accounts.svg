<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336 859" role="img"
     aria-labelledby="t d" font-family="IBM Plex Mono, ui-monospace, monospace">
  <title id="t">Club, teams and accounts</title>
  <desc id="d">Season, Team and TeamSeason, which crosses them; Membership, which ties a User to a TeamSeason; WorkshopSlot, a season's workshop hours; User, the VerificationRequest filed at sign-up, and Consent, the log of image-rights decisions.</desc>

  <style>
    .bg   { fill:#ffffff }
    .bx   { fill:#ffffff; stroke:#1f2933; stroke-width:1.3 }
    .sep  { stroke:#1f2933; stroke-width:1; opacity:.45 }
    .ttl  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:15px; font-weight:700; fill:#1f2933 }
    .col  { font-size:12px; fill:#1f2933 }
    .typ  { font-size:11px; fill:#3e6aa8 }
    .ann  { font-size:11px; fill:#1f2933; opacity:.6 }
    .lnk  { stroke:#1f2933; stroke-width:1.3; fill:none }
    .cap  { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:11.5px; fill:#1f2933; opacity:.75 }
    .head { font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
            font-size:18px; font-weight:700; fill:#1f2933 }
    .lgt  { font-size:11.5px; fill:#1f2933; font-weight:600 }
    .lgd  { font-size:11.5px; fill:#1f2933; opacity:.75 }
  </style>

  <rect class="bg" width="1336" height="859"/>
  <text class="head" x="30" y="34">Club, teams and accounts</text>

  <!-- Season -->
  <rect class="bx" x="30" y="60" width="238" height="95" rx="3"/>
  <line class="sep" x1="30" y1="86" x2="268" y2="86"/>
  <text class="ttl" x="42" y="79">Season</text>
  <text class="col" x="42" y="105">id</text> <text class="typ" x="129" y="105">bigint</text> <text class="ann" x="217" y="105">PK</text>
  <text class="col" x="42" y="124">start_year</text> <text class="typ" x="129" y="124">smallint</text> <text class="ann" x="217" y="124">UNIQUE</text>
  <text class="col" x="42" y="143">game_name</text> <text class="typ" x="129" y="143">varchar(60)</text> <text class="ann" x="217" y="143">UNIQUE</text>
  <text class="cap" x="30" y="177">the end year is always the next one</text>
  <text class="cap" x="30" y="193">FIRST never reuses a game name</text>
  <!-- TeamSeason -->
  <rect class="bx" x="348" y="60" width="291" height="114" rx="3"/>
  <line class="sep" x1="348" y1="86" x2="639" y2="86"/>
  <text class="ttl" x="360" y="79">TeamSeason</text>
  <text class="col" x="360" y="105">id</text> <text class="typ" x="440" y="105">bigint</text> <text class="ann" x="494" y="105">PK</text>
  <text class="col" x="360" y="124">team_id</text> <text class="typ" x="440" y="124">bigint</text> <text class="ann" x="494" y="124">FK → Team, PROTECT</text>
  <text class="col" x="360" y="143">season_id</text> <text class="typ" x="440" y="143">bigint</text> <text class="ann" x="494" y="143">FK → Season, PROTECT</text>
  <text class="ann" x="360" y="162">UNIQUE (team_id, season_id)</text>
  <!-- Team -->
  <rect class="bx" x="719" y="60" width="216" height="95" rx="3"/>
  <line class="sep" x1="719" y1="86" x2="935" y2="86"/>
  <text class="ttl" x="731" y="79">Team</text>
  <text class="col" x="731" y="105">id</text> <text class="typ" x="789" y="105">bigint</text> <text class="ann" x="883" y="105">PK</text>
  <text class="col" x="731" y="124">number</text> <text class="typ" x="789" y="124">int</text> <text class="ann" x="883" y="124">UNIQUE</text>
  <text class="col" x="731" y="143">name</text> <text class="typ" x="789" y="143">varchar(120)</text>
  <text class="cap" x="719" y="177">number assigned by FIRST</text>
  <!-- WorkshopSlot -->
  <rect class="bx" x="30" y="230" width="319" height="190" rx="3"/>
  <line class="sep" x1="30" y1="256" x2="349" y2="256"/>
  <text class="ttl" x="42" y="249">WorkshopSlot</text>
  <text class="col" x="42" y="275">id</text> <text class="typ" x="136" y="275">bigint</text> <text class="ann" x="204" y="275">PK</text>
  <text class="col" x="42" y="294">season_id</text> <text class="typ" x="136" y="294">bigint</text> <text class="ann" x="204" y="294">FK → Season, PROTECT</text>
  <text class="col" x="42" y="313">weekday</text> <text class="typ" x="136" y="313">smallint</text> <text class="ann" x="204" y="313">0 = Monday</text>
  <text class="col" x="42" y="332">start_time</text> <text class="typ" x="136" y="332">time</text>
  <text class="col" x="42" y="351">end_time</text> <text class="typ" x="136" y="351">time</text> <text class="ann" x="204" y="351">null</text>
  <text class="col" x="42" y="370">valid_from</text> <text class="typ" x="136" y="370">date</text>
  <text class="col" x="42" y="389">valid_until</text> <text class="typ" x="136" y="389">date</text> <text class="ann" x="204" y="389">null</text>
  <text class="ann" x="42" y="408">CHECK valid_until ≥ valid_from</text>
  <!-- Membership -->
  <rect class="bx" x="409" y="244" width="355" height="114" rx="3"/>
  <line class="sep" x1="409" y1="270" x2="764" y2="270"/>
  <text class="ttl" x="421" y="263">Membership</text>
  <text class="col" x="421" y="289">id</text> <text class="typ" x="537" y="289">bigint</text> <text class="ann" x="591" y="289">PK</text>
  <text class="col" x="421" y="308">user_id</text> <text class="typ" x="537" y="308">bigint</text> <text class="ann" x="591" y="308">FK → User, CASCADE</text>
  <text class="col" x="421" y="327">team_season_id</text> <text class="typ" x="537" y="327">bigint</text> <text class="ann" x="591" y="327">FK → TeamSeason, CASCADE</text>
  <text class="ann" x="421" y="346">UNIQUE (user_id, team_season_id)</text>
  <text class="cap" x="784" y="294">a plain link: no role</text>
  <!-- VerificationRequest -->
  <rect class="bx" x="30" y="495" width="372" height="152" rx="3"/>
  <line class="sep" x1="30" y1="521" x2="402" y2="521"/>
  <text class="ttl" x="42" y="514">VerificationRequest</text>
  <text class="col" x="42" y="540">id</text> <text class="typ" x="129" y="540">bigint</text> <text class="ann" x="217" y="540">PK</text>
  <text class="col" x="42" y="559">user_id</text> <text class="typ" x="129" y="559">bigint</text> <text class="ann" x="217" y="559">FK → User, CASCADE, UNIQUE</text>
  <text class="col" x="42" y="578">last_name</text> <text class="typ" x="129" y="578">varchar(80)</text>
  <text class="col" x="42" y="597">first_name</text> <text class="typ" x="129" y="597">varchar(80)</text>
  <text class="col" x="42" y="616">birth_date</text> <text class="typ" x="129" y="616">date</text>
  <text class="col" x="42" y="635">created_at</text> <text class="typ" x="129" y="635">datetime</text>
  <text class="cap" x="30" y="669">what sign-up typed, to find the AssoConnect</text>
  <text class="cap" x="30" y="685">membership; deleted once verified</text>
  <text class="cap" x="30" y="701">the declared date never decides who is a minor</text>
  <!-- User -->
  <rect class="bx" x="462" y="495" width="425" height="304" rx="3"/>
  <line class="sep" x1="462" y1="521" x2="887" y2="521"/>
  <text class="ttl" x="474" y="514">User</text>
  <text class="col" x="474" y="540">id</text> <text class="typ" x="627" y="540">bigint</text> <text class="ann" x="721" y="540">PK</text>
  <text class="col" x="474" y="559">email</text> <text class="typ" x="627" y="559">varchar(254)</text> <text class="ann" x="721" y="559">UNIQUE</text>
  <text class="col" x="474" y="578">display_name</text> <text class="typ" x="627" y="578">varchar(80)</text>
  <text class="col" x="474" y="597">display_name_folded</text> <text class="typ" x="627" y="597">varchar(160)</text> <text class="ann" x="721" y="597">UNIQUE</text>
  <text class="col" x="474" y="616">contact_email</text> <text class="typ" x="627" y="616">varchar(254)</text> <text class="ann" x="721" y="616">may be empty</text>
  <text class="col" x="474" y="635">avatar</text> <text class="typ" x="627" y="635">varchar(100)</text> <text class="ann" x="721" y="635">file path, may be empty</text>
  <text class="col" x="474" y="654">assoconnect_id</text> <text class="typ" x="627" y="654">varchar(30)</text> <text class="ann" x="721" y="654">UNIQUE, null</text>
  <text class="col" x="474" y="673">birth_date</text> <text class="typ" x="627" y="673">date</text> <text class="ann" x="721" y="673">null</text>
  <text class="col" x="474" y="692">club_role</text> <text class="typ" x="627" y="692">varchar(10)</text> <text class="ann" x="721" y="692">student | mentor</text>
  <text class="col" x="474" y="711">is_club_admin</text> <text class="typ" x="627" y="711">bool</text> <text class="ann" x="721" y="711">default FALSE</text>
  <text class="col" x="474" y="730">is_active</text> <text class="typ" x="627" y="730">bool</text> <text class="ann" x="721" y="730">default TRUE</text>
  <text class="col" x="474" y="749">is_staff</text> <text class="typ" x="627" y="749">bool</text> <text class="ann" x="721" y="749">default FALSE</text>
  <text class="col" x="474" y="768">date_joined</text> <text class="typ" x="627" y="768">datetime</text>
  <text class="ann" x="474" y="787">+ password, last_login, is_superuser (Django)</text>
  <text class="cap" x="462" y="821">email and display_name identify; mail goes to contact_email</text>
  <text class="cap" x="462" y="837">is_minor is computed from the verified birth_date, not stored</text>
  <!-- Consent -->
  <rect class="bx" x="967" y="495" width="339" height="133" rx="3"/>
  <line class="sep" x1="967" y1="521" x2="1306" y2="521"/>
  <text class="ttl" x="979" y="514">Consent</text>
  <text class="col" x="979" y="540">id</text> <text class="typ" x="1066" y="540">bigint</text> <text class="ann" x="1154" y="540">PK</text>
  <text class="col" x="979" y="559">user_id</text> <text class="typ" x="1066" y="559">bigint</text> <text class="ann" x="1154" y="559">FK → User, CASCADE</text>
  <text class="col" x="979" y="578">decision</text> <text class="typ" x="1066" y="578">varchar(10)</text> <text class="ann" x="1154" y="578">granted | refused</text>
  <text class="col" x="979" y="597">granted_by</text> <text class="typ" x="1066" y="597">varchar(15)</text> <text class="ann" x="1154" y="597">self | legal_guardian</text>
  <text class="col" x="979" y="616">decided_at</text> <text class="typ" x="1066" y="616">datetime</text>
  <text class="cap" x="967" y="650">image rights: a log of decisions, never rewritten</text>
  <text class="cap" x="967" y="666">no uniqueness: the latest row is the one in force</text>
  <text class="cap" x="967" y="682">no decision at all is not a refusal</text>
  <line class="lnk" x1="268" y1="139" x2="348" y2="139"/>
  <line class="lnk" x1="274" y1="132" x2="274" y2="146"/>
  <path class="lnk" d="M336,139 L348,131 M336,139 L348,139 M336,139 L348,147"/>
  <line class="lnk" x1="719" y1="120" x2="639" y2="120"/>
  <line class="lnk" x1="713" y1="113" x2="713" y2="127"/>
  <path class="lnk" d="M651,120 L639,112 M651,120 L639,120 M651,120 L639,128"/>
  <line class="lnk" x1="246" y1="155" x2="246" y2="230"/>
  <line class="lnk" x1="239" y1="161" x2="253" y2="161"/>
  <path class="lnk" d="M246,218 L238,230 M246,218 L246,230 M246,218 L254,230"/>
  <line class="lnk" x1="469" y1="174" x2="469" y2="244"/>
  <line class="lnk" x1="462" y1="180" x2="476" y2="180"/>
  <path class="lnk" d="M469,232 L461,244 M469,232 L469,244 M469,232 L477,244"/>
  <line class="lnk" x1="502" y1="495" x2="502" y2="358"/>
  <line class="lnk" x1="495" y1="489" x2="509" y2="489"/>
  <path class="lnk" d="M502,370 L494,358 M502,370 L502,358 M502,370 L510,358"/>
  <line class="lnk" x1="462" y1="555" x2="402" y2="555"/>
  <line class="lnk" x1="456" y1="548" x2="456" y2="562"/>
  <line class="lnk" x1="408" y1="548" x2="408" y2="562"/>
  <line class="lnk" x1="887" y1="555" x2="967" y2="555"/>
  <line class="lnk" x1="893" y1="548" x2="893" y2="562"/>
  <path class="lnk" d="M955,555 L967,547 M955,555 L967,555 M955,555 L967,563"/>
</svg>
