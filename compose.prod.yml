# The final deployment: HTTPS terminated by Caddy (deploy/Caddyfile) in
# front of Django (Daphne, ASGI) and the built frontend it bakes in — no
# dev server, no bind mount, no hot reload. See README, "Getting started".
# A fixed name, not the clone's folder: the volumes holding the models, the
# certificate and the club's data keep their names wherever it is cloned.
name: fieldnotes

services:
  # A static, long-lived self-signed certificate for FIELDNOTES_HOST,
  # generated once and kept in tls_certs — not regenerated on every `up`,
  # so the browser's one-time warning stays one-time. Exits once it's
  # written the files; proxy only starts after it succeeds.
  #
  # Runs from the backend's own image, already pulled and built by the
  # time this starts, rather than a bare `alpine` needing `apk add
  # openssl` from the network: changing FIELDNOTES_HOST later means
  # removing tls_certs so this regenerates, and the club may be doing
  # that from its own address, in its own room, with no connection out.
  cert-init:
    image: transcendence-backend
    # No build: of its own, so Compose would otherwise try Docker Hub
    # first on a machine where this image doesn't exist yet — the one
    # `backend` builds right below is the only one this name should ever
    # resolve to.
    pull_policy: never
    depends_on:
      - backend
    env_file: ./backend/.env
    volumes:
      - tls_certs:/certs
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ -f /certs/fieldnotes.crt ]; then
          echo "fieldnotes.crt already present, keeping it."
          exit 0
        fi
        host="$${FIELDNOTES_HOST:-localhost}"
        case "$$host" in
          [0-9]*.[0-9]*.[0-9]*.[0-9]*) host_san="IP:$$host" ;;
          *) host_san="DNS:$$host" ;;
        esac
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
          -keyout /certs/fieldnotes.key -out /certs/fieldnotes.crt \
          -subj "/CN=$$host" \
          -addext "subjectAltName=$$host_san,DNS:localhost,IP:127.0.0.1"
        echo "fieldnotes.crt generated for $$host (10y, self-signed)."

  backend:
    build: ./backend
    image: transcendence-backend
    env_file: ./backend/.env
    environment:
      # Named volume, not BASE_DIR/db.sqlite3: this container has no bind
      # mount to keep that file outside the image, unlike dev's.
      DJANGO_DB_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
      - media_files:/app/media
      - fastembed_cache:/app/.cache
      - static_files:/app/staticfiles
    # exec: Daphne replaces the shell as PID 1, so `docker compose stop`'s
    # SIGTERM reaches it and it closes its connections, instead of the shell
    # ignoring it until Docker kills both ten seconds later.
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      exec daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
      interval: 3s
      timeout: 2s
      retries: 10

  # Checks the rulebook's sources against their official pages every 24 hours.
  # Same image and database as `backend`, so it starts only once the backend
  # has migrated and answers its healthcheck. A changed page is only ever
  # recorded as an update for an administrator to accept (club/sources.py).
  sources-check:
    image: transcendence-backend
    pull_policy: never
    depends_on:
      backend:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      # 86400 seconds is 24 hours; shorter values are for testing the loop.
      SOURCES_CHECK_INTERVAL_SECONDS: ${SOURCES_CHECK_INTERVAL_SECONDS:-86400}
    volumes:
      - sqlite_data:/app/data
    command: >-
      sh -c "while true; do python manage.py check_sources; sleep $$SOURCES_CHECK_INTERVAL_SECONDS; done"
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: ./backend/.env
    volumes:
      # Read-only: Caddy only ever serves these, collectstatic is the one
      # writer.
      - static_files:/srv/static:ro
      - tls_certs:/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      cert-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  # The rulebook's generated answer (#135, club/generation.py). Missing
  # here until #207's own review caught it: `backend` defaults to
  # `RAG_OLLAMA_URL=http://ollama:11434` (config/settings.py), a name that
  # only resolves inside a Compose network that has a service by that
  # name — without this, every question deployed at the club would fall
  # back to its citations alone, forever, with nothing to say why.
  # Decoupled from `backend` the same way as in compose.yml: a question
  # asked while the model is still downloading degrades gracefully
  # instead of the whole stack waiting on a ~2 GB pull.
  ollama:
    # Pinned rather than :latest, so a pull on one machine can't hand
    # another a different model server mid-review.
    image: ollama/ollama:0.40.0
    environment:
      # No accuracy cost, measured on the real manual (#135's own review):
      # same model, same answers, meaningfully faster prompt processing.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_models:/root/.ollama
    ports:
      # Bound to the host alone: Ollama's API carries no auth, and the
      # README already has phones joining the dev stack over the club's
      # Wi-Fi — an unqualified host port would hand the whole LAN a free
      # model server. This stack, over HTTPS, is reachable by more than
      # just the dev case this protects against.
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 2s
      retries: 20

  # One-shot: pulls RAG_GENERATION_MODEL (backend/.env) once, then exits.
  # Reruns on every `up`, but `ollama pull` is a no-op once the model is
  # already there.
  ollama-pull:
    image: ollama/ollama:0.40.0
    env_file: ./backend/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        ollama pull "$${RAG_GENERATION_MODEL:-qwen2.5:3b}"
        # Loads the model into memory now rather than leaving that cost
        # for the first real question — a cold load can run past
        # GENERATION_TIMEOUT_SECONDS on its own, generation.py's sole
        # safety net meant for a slow answer, not a slow load.
        ollama run "$${RAG_GENERATION_MODEL:-qwen2.5:3b}" "" || true

volumes:
  sqlite_data:
  media_files:
  fastembed_cache:
  static_files:
  tls_certs:
  ollama_models:
