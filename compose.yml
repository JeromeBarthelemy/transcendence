services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # `backend` is the Host that Vite's proxy sends. A phone's address goes
      # in DJANGO_DEV_ORIGINS (backend/.env), which extends this list.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
    # exec: the server replaces the shell as PID 1, so `docker compose stop`'s
    # SIGTERM reaches it instead of being ignored until Docker kills it.
    command: >-
      sh -c "python manage.py migrate &&
      exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
      interval: 3s
      timeout: 2s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  # The rulebook's generated answer (#135, club/generation.py). Decoupled
  # from backend on purpose: a question asked while the model is still
  # downloading degrades to citations alone (club/generation.py,
  # GenerationError) instead of the whole stack waiting on a ~2 GB pull.
  ollama:
    image: ollama/ollama:latest
    environment:
      # No accuracy cost, measured on the real manual (#135's own review):
      # same model, same answers, meaningfully faster prompt processing.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 2s
      retries: 20

  # One-shot: pulls RAG_GENERATION_MODEL (backend/.env) once, then exits.
  # Reruns on every `up`, but `ollama pull` is a no-op once the model is
  # already there.
  ollama-pull:
    image: ollama/ollama:latest
    env_file: ./backend/.env
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        ollama pull "$${RAG_GENERATION_MODEL:-qwen2.5:3b}"

volumes:
  frontend_node_modules:
  ollama_models:
