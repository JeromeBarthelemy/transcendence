services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
    # exec: the server replaces the shell as PID 1, so `docker compose stop`'s
    # SIGTERM reaches it instead of being ignored until Docker kills it.
    command: >-
      sh -c "python manage.py migrate &&
      exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"
      interval: 3s
      timeout: 2s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
